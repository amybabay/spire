configuration_id: 1
tolerated_byzantine_faults: 1
tolerated_unavailable_replicas: 0

sites:
  - name: control_center1
    type: CONTROL_CENTER
    hosts:
      - name: goldenrod1
        ip: 192.168.101.101
        permanent_key_location: "prime/bin/tpm_keys/tpm_private1.key"
        runs_spines_internal: 1
        runs_spines_external: 1
      - name: goldenrod2
        ip: 192.168.101.102
        permanent_key_location: "prime/bin/tpm_keys/tpm_private2.key"
        runs_spines_internal: 1
        runs_spines_external: 1
      - name: goldenrod3
        ip: 192.168.101.103
        permanent_key_location: "prime/bin/tpm_keys/tpm_private3.key"
        runs_spines_internal: 1
        runs_spines_external: 1
      - name: goldenrod4
        ip: 192.168.101.104
        permanent_key_location: "prime/bin/tpm_keys/tpm_private4.key"
        runs_spines_internal: 1
        runs_spines_external: 1

    replicas:
      - instance_id: 1
        host: goldenrod1
        spines_internal_daemon: goldenrod1
        spines_external_daemon: goldenrod1
      - instance_id: 2
        host: goldenrod2
        spines_internal_daemon: goldenrod2
        spines_external_daemon: goldenrod2
      - instance_id: 3
        host: goldenrod3
        spines_internal_daemon: goldenrod3
        spines_external_daemon: goldenrod3
      - instance_id: 4
        host: goldenrod4
        spines_internal_daemon: goldenrod4
        spines_external_daemon: goldenrod4

  - name: plc_site
    type: CLIENT
    hosts:
      - name: goldenrod10
        ip: 192.168.101.107
        runs_spines_external: 1

  - name: hmi_site
    type: CLIENT
    hosts:
      - name: goldenrod11
        ip: 192.168.101.108
        runs_spines_external: 1
    clients:
      - client_id: 2 
        host: goldenrod11
        spines_external_daemon: goldenrod11
        type: (hmis (JHU, PNNL, or EMS), proxy, benchmark) # args needed: spines addr, port (specified in def.h as SPINES_EXT_PORT, SPINES_INT_PORT)
        # keys
        # instance_public_key: XXXX
        # encrypted_instance_private_key: XXXX
        